<!DOCTYPE html>
<html>
<head>
    <title>Farmer Procurement System</title>
</head>

<body>

    <h1>🌾 Farmer Procurement System</h1>

    <h2>Farmer Registration</h2>

    <form>

        <label>Farmer Name:</label><br>
        <input type="text" placeholder="Enter your name">
        <br><br>

        <label>Mobile Number:</label><br>
        <input type="tel" placeholder="Enter mobile number">
        <br><br>

        <label>Village:</label><br>
        <input type="text" placeholder="Enter village">
        <br><br>

        <label>Taluka:</label><br>
        <input type="text" placeholder="Enter taluka">
        <br><br>

        <label>District:</label><br>
        <input type="text" placeholder="Enter district">
        <br><br>

        <label>Crop:</label><br>
        <select>
            <option>Select Crop</option>
            <option>Wheat</option>
            <option>Rice</option>
            <option>Onion</option>
            <option>Maize</option>
            <option>Cotton</option>
        </select>

        <br><br>

        <label>Quantity:</label><br>
        <input type="number" placeholder="Enter quantity">

        <select>
            <option>Quintal</option>
            <option>Kg</option>
            <option>Ton</option>
        </select>

        <br><br>

        <button type="submit">REGISTER</button>

    </form>

</body>
</html>
