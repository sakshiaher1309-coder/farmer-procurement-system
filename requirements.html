<html>
    <!DOCTYPE html>
<html>
<head>

    <title>KisanFlow - Crop Requirements</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f5;
            color: #333;
        }

        .main {
            padding: 30px;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .header h1 {
            color: #1b5e20;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
        }

        .form-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            max-width: 700px;
        }

        .form-section h2 {
            color: #1b5e20;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2e7d32;
        }

        button {
            padding: 13px 25px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .back-btn {
            background: #777;
            margin-left: 10px;
        }

        .back-btn:hover {
            background: #555;
        }

    </style>

</head>

<body>

    <div class="main">

        <div class="header">

            <h1>
                🌾 Crop Requirements
            </h1>

            <p>
                Enter crop requirement details for procurement.
            </p>

        </div>


        <div class="form-section">

            <h2>
                📋 Enter Crop Details
            </h2>


            <label>
                Select Crop
            </label>

            <select id="crop">

                <option value="">
                    Select Crop
                </option>

                <option>
                    Wheat
                </option>

                <option>
                    Rice
                </option>

                <option>
                    Soybean
                </option>

                <option>
                    Maize
                </option>

                <option>
                    Onion
                </option>

            </select>


            <label>
                Required Quantity (KG)
            </label>

            <input
                type="number"
                id="quantity"
                placeholder="Enter required quantity"
            >


            <label>
                Procurement Rate (₹ per KG)
            </label>

            <input
                type="number"
                id="rate"
                placeholder="Enter procurement rate"
            >


            <label>
                Centre Capacity (KG)
            </label>

            <input
                type="number"
                id="capacity"
                placeholder="Enter centre capacity"
            >


            <button onclick="saveRequirement()">
                💾 Save Requirement
            </button>

            <button
                class="back-btn"
                onclick="window.location.href='dashboard.html'"
            >
                ← Back to Dashboard
            </button>

        </div>

    </div>


    <script>
function saveRequirement() {
    let crop = document.getElementById("crop").value;
    let quantity = document.getElementById("quantity").value;
    let rate = document.getElementById("rate").value;
    let capacity = document.getElementById("capacity").value;

    if (crop == "" || quantity == "" || rate == "" || capacity == "") {
        alert("Please enter all crop details!");
        return;
    }

    localStorage.setItem("requirementCrop", crop);
    localStorage.setItem("totalProcurement", quantity);
    localStorage.setItem("procurementRate", rate);
    localStorage.setItem("centreCapacity", capacity);

    alert("Crop requirement saved successfully!");
}
    </script>

</body>
</html>
